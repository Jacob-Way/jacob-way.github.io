# Site-wide details. Restart jekyll serve after changing this file.
title: Jacob Way
description: "Jacob Way — distributed computing and graph algorithms"
url: "https://jacob-way.github.io"
baseurl: ""
locale: en-US
timezone: Etc/UTC

# Only categories with papers appear. Order here controls the CV's paper groups.
publication_category:
  books:
    title: Books
  manuscripts:
    title: Unpublished Manuscripts
  in-submission:
    title: In Submission
  journal-articles:
    title: Journal Articles
  conferences:
    title: Conference Papers

collections:
  publications:
    output: true
    permalink: /publication/:path/
  presentations:
    output: true
    permalink: /presentations/:path/
  articles:
    output: true
    permalink: /articles/:path/

# New pages need only a title and permalink; layouts are automatic.
defaults:
  - scope:
      path: ""
    values:
      layout: default
include:
  - _pages
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - local
  - vendor
  - node_modules
  - .bundle
  - .github

markdown: kramdown
kramdown:
  input: GFMWithMath
  hard_wrap: false
  math_engine: mathjax
permalink: /posts/:year/:month/:title/
future: false
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

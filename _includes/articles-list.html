{% assign articles = site.articles | where: 'category', include.category | where_exp: 'item', 'item.published != false' | sort: 'date' | reverse %}
{% if articles.size > 0 %}
<ul>
{% for article in articles %}
<li><a href="{{ article.url | relative_url }}">{{ article.title | escape }}</a></li>
{% endfor %}
</ul>
{% endif %}
